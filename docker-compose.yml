services:
  pgdatabase:
    profiles: ["warehouse"]
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: "sncb_bruxelles"
    volumes:
      - "sncb_bruxelles_data:/var/lib/postgresql"
    ports:
       - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    profiles: ["warehouse"]
    image: dpage/pgadmin4:9.18.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${DB_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    ports:
      - "8085:80"

  ingest:
    build:                  # le dossier où se trouve le Dockerfile (comme le « . » de docker build)
      context: .
      target: ingest
    env_file: .env              # le fichier qui contient tes variables
    volumes:
      - "./data:/app/data"        # à gauche : le dossier data de TON PC ; à droite : /app/data dans le conteneur
  transform:
    build:
      context: .
      target: transform
    env_file: .env
    volumes:
      - "./data:/app/data"           # le MÊME dossier : il lit le bronze écrit par ingest
    command: ["sh", "-c", "irail-transform $(date -u +%F)"]
    depends_on:
      ingest:
        condition: service_completed_successfully

volumes:
  sncb_bruxelles_data:
  pgadmin_data:
